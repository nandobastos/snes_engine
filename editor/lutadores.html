<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lutadores - SF Engine</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0 8px 0 0}main{display:grid;grid-template-columns:240px 1fr;gap:12px;padding:12px 16px}
@media(max-width:700px){main{grid-template-columns:1fr}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px}
button{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button.p{background:var(--ac);color:#000;border-color:var(--ac)}button:disabled{opacity:.4}
.it{display:block;width:100%;text-align:left;margin-bottom:6px}.it.on{border-color:var(--ac)}
small{color:var(--mu)}table{border-collapse:collapse;width:100%;overflow-x:auto;display:block}
td,th{border-bottom:1px solid var(--ln);padding:3px 4px;text-align:left;font-weight:normal}th{color:var(--mu);font-size:12px}
input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:3px 5px;width:62px;font:inherit}
input.n{width:200px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 12px}
div.cmd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}div.cmd b{flex:1 1 260px;font-weight:normal}div.cmd .seq{min-width:120px;font-size:18px;letter-spacing:2px}div.cmd .ks button{padding:3px 7px;margin:1px}
.flow{display:grid;grid-template-columns:1fr 270px;gap:10px}.flow-canvas{overflow:auto;max-height:76vh;background:var(--bg);border:1px solid var(--ln);border-radius:8px}.flow-side label{display:block}.flow-side select,.flow-side input{width:100%;margin-top:4px}@media(max-width:800px){.flow{grid-template-columns:1fr}}
textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:4px;font:inherit;padding:4px}
label{display:flex;justify-content:space-between;gap:6px;align-items:center}#msg{color:var(--mu)}
</style>
<link rel="stylesheet" href="tema.css"><script src="tema.js"></script></head><body>
<header><h1>Lutadores</h1>
<input type="file" id="arq" accept=".json" hidden>
<button id="abrir">Abrir game.json</button>
<button id="clonar" disabled>Clonar</button><button id="novo" disabled>Novo (a partir de um modelo)</button>
<button id="rem" disabled>Excluir</button><button id="regras" disabled>Regras e HUD</button><button id="telas" disabled>Telas (fluxo)</button><button class="p" id="salvar" disabled>Salvar game.json</button>
<input type="file" id="arqArte" accept=".json" multiple hidden><button id="arte" disabled>Carregar arte (SF Pixel)</button>
<button id="rom" disabled>Gerar ROM (.sfc)</button><button class="p" id="jogar" disabled>Jogar</button>
<input type="file" id="arqBase" accept=".sfc" hidden><input type="file" id="arqImg" accept="image/*" hidden><input type="file" id="arqStg" accept=".json" multiple hidden>
<span id="msg">Abra o arquivo project/game.json do seu projeto.</span></header>
<main><div class="pn"><div id="lista"></div><small>Os 3 originais não podem ser excluídos. Clones e novos têm cópia própria dos golpes: mudar um não muda o outro.</small></div>
<div class="pn" id="ed"><small>Selecione um lutador.</small></div></main>
<script src="sfbuild.js"></script>
<script src="sfstage.js"></script>
<script src="telas.js"></script>
<script>
const TOK=[['↓',14,2],['↘',14,10],['→',14,8],['↗',15,9],['↑',15,1],['↖',15,5],['←',14,4],['↙',14,6],['→*',12,8],['←*',12,4]];
const tok=([m,v])=>{const t=TOK.find(x=>x[1]===m&&x[2]===v);return t?t[0]:m+'/'+v};
const DEFCMD=[[[14,2],[14,10],[14,8]],[[14,2],[14,6],[14,4]],[[14,8],[14,10]],[[14,8],[14,10],[12,8]],[[14,2],[14,10],[14,8],[14,2],[14,10],[14,8]]];
const CMDN=['Magia + soco (Hadouken; Sagat: Tiger Shot, chute = rasteiro)','Giro + chute (Tatsumaki)','Golpe para cima + soco (Shoryuken; Sagat: Tiger Uppercut, chute = Tiger Knee)','Atalho do golpe para cima','Super + soco forte (3 bolinhas)'];
const MAX=8, ORIG=3; let G=null, sel=0; const ARTS={}, STAGES={}; let BASE=null, BASEJ=null;
const $=id=>document.getElementById(id);
const TR=[["jump_vy","Força do pulo"],["walk_ticks","Passo do andar (quadros)"],["walk_adj","Ajuste de velocidade"],["fb_alt_hi","Altura da magia (alta)"],["fb_alt_lo","Altura da magia (baixa)"],["fb_sfx","Som da magia"],["hp_close_hk","HP de perto = HK de perto (0/1)"],["walk_pingpong","Andar vai e volta (0/1)"],["moveset","Especiais (0 = estilo Ryu, 1 = Sagat)"],["walk_fwd","Velocidade andando para frente"],["walk_back","Velocidade andando para trás"],["jump_vx","Velocidade do pulo para o lado"],["grav_up","Gravidade subindo (menor = pula mais alto)"],["grav_dn","Gravidade descendo"],["fb_spd","Magia fraca: velocidade"],["fb_dmg","Magia fraca: dano"],["fb_spd_s","Magia média: velocidade"],["fb_dmg_s","Magia média: dano"],["fb_spd_ex","Magia reforçada (EX): velocidade"],["fb_dmg_ex","Magia reforçada (EX): dano"],["fb_spd_sup","Super: velocidade"],["fb_dmg_sup","Super: dano"]];
const MV=[["dmg","Dano"],["stun","Stun"],["hgt","Altura"],["flags","Flags"],["hitstop","Hitstop"],["snd_swing","Som do golpe"],["snd_hit","Som do impacto"]];
function msg(t){$('msg').textContent=t}
function refresh(){
  const L=$('lista');L.innerHTML='';
  G.fighters.forEach((f,i)=>{const b=document.createElement('button');b.className='it'+(i==sel?' on':'');
    const t=f.traits;b.innerHTML=f.name+'<br><small>'+(t.clone_of?'clone de '+t.clone_of:i<ORIG?'original':'novo')+'</small>';
    b.onclick=()=>{sel=i;refresh()};L.appendChild(b)});
  ['clonar','novo','salvar','arte','rom','jogar','regras','telas'].forEach(k=>$(k).disabled=false);$('rem').disabled=sel<ORIG;
  const f=G.fighters[sel],e=$('ed');e.innerHTML='';
  const nm=document.createElement('label');nm.innerHTML='<b>Nome</b>';const ni=document.createElement('input');ni.className='n';ni.value=f.name;
  ni.onchange=()=>{f.name=ni.value.trim()||f.name;refresh()};nm.appendChild(ni);e.appendChild(nm);
  const ar=document.createElement('label');ar.innerHTML='<b>Arte (SF Pixel)</b>';const as=document.createElement('select');
  as.innerHTML='<option value="">— a do lutador de origem —</option>'+Object.keys(ARTS).concat(f.traits.art&&!ARTS[f.traits.art]?[f.traits.art]:[]).map(n=>'<option'+(n===f.traits.art?' selected':'')+'>'+n+'</option>').join('');
  as.onchange=()=>{if(as.value)f.traits.art=as.value;else delete f.traits.art;refresh()};ar.appendChild(as);e.appendChild(ar);
  if(f.traits.art&&!ARTS[f.traits.art])e.insertAdjacentHTML('beforeend','<p><small style="color:#c22">Carregue o arquivo '+f.traits.art+' (botão Carregar arte) antes de gerar a ROM.</small></p>');
  const sl=document.createElement('label');sl.innerHTML='<b>Estágio (quando ele é o P2)</b>';const ss=document.createElement('select');
  ss.innerHTML='<option value="">— o estágio padrão —</option>'+Object.keys(STAGES).concat(f.traits.stage&&!STAGES[f.traits.stage]?[f.traits.stage]:[]).map(n=>'<option'+(n===f.traits.stage?' selected':'')+'>'+n+'</option>').join('');
  ss.onchange=()=>{if(ss.value)f.traits.stage=ss.value;else delete f.traits.stage;refresh()};sl.appendChild(ss);e.appendChild(sl);
  const sb=document.createElement('div');sb.style.margin='6px 0';sb.innerHTML='<button id="stNew">Criar estágio de uma imagem…</button> <button id="stLoad">Carregar estágio (.sfstage.json)</button>';e.appendChild(sb);
  if(f.traits.stage&&STAGES[f.traits.stage]){const cv=document.createElement('canvas');cv.width=256;cv.height=224;cv.style.cssText='width:256px;max-width:100%;image-rendering:pixelated;border:1px solid var(--ln);display:block';cv.getContext('2d').putImageData(SFStage.render(STAGES[f.traits.stage]),0,0);e.appendChild(cv);
    e.insertAdjacentHTML('beforeend','<small>'+STAGES[f.traits.stage].tiles+' tiles de 512.</small>')}
  else if(f.traits.stage)e.insertAdjacentHTML('beforeend','<p><small style="color:#c22">Carregue o arquivo '+f.traits.stage+' antes de gerar a ROM.</small></p>');
  $('stNew').onclick=()=>$('arqImg').click();$('stLoad').onclick=()=>$('arqStg').click();
  e.insertAdjacentHTML('beforeend','<h3>Frase de vitória</h3>');const qa=document.createElement('textarea');qa.maxLength=112;qa.rows=2;qa.value=f.win_quote||'';
  qa.placeholder='Ex.: Meus punhos são de ferro! (até 4 linhas de 28 letras)';qa.oninput=()=>{f.win_quote=qa.value};e.appendChild(qa);
  e.insertAdjacentHTML('beforeend','<h3>Características</h3>');const g=document.createElement('div');g.className='g';
  TR.forEach(([k,n])=>{const l=document.createElement('label');l.textContent=n;const i=document.createElement('input');i.type='number';i.value=f.traits[k];
    i.onchange=()=>{f.traits[k]=+i.value};l.appendChild(i);g.appendChild(l)});e.appendChild(g);
  e.insertAdjacentHTML('beforeend','<h3>Comandos dos especiais</h3><p><small>Direções do primeiro ao último passo (o lutador olhando para a direita: → = frente). Clique nas setas para montar; ⌫ apaga o último passo. →* = qualquer frente (com ou sem baixo).</small></p>');
  if(!f.commands)f.commands=JSON.parse(JSON.stringify(DEFCMD));
  CMDN.forEach((nm,ci)=>{const row=document.createElement('div');row.className='cmd';
    const show=()=>row.querySelector('.seq').textContent=f.commands[ci].length?f.commands[ci].map(tok).join(' '):'(nenhum: desligado)';
    row.innerHTML='<b>'+nm+'</b><span class="seq"></span><span class="ks">'+TOK.map((t,ti)=>'<button data-t="'+ti+'">'+t[0]+'</button>').join('')+'<button data-t="x">⌫</button><button data-t="d">padrão</button></span>';
    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=b.dataset.t,c=f.commands[ci];
      if(t==='x')c.pop();else if(t==='d')f.commands[ci]=JSON.parse(JSON.stringify(DEFCMD[ci]));else if(c.length<7)c.push([TOK[+t][1],TOK[+t][2]]);else msg('Máximo 7 passos.');show()});
    e.appendChild(row);show()});
  e.insertAdjacentHTML('beforeend','<h3>Golpes</h3>');
  const t=document.createElement('table');t.innerHTML='<tr><th>Golpe</th>'+MV.map(m=>'<th>'+m[1]+'</th>').join('')+'<th>Duração dos quadros (8)</th></tr>';
  G.atk_names.forEach(a=>{const m=f.moves[a];const r=t.insertRow();r.insertCell().textContent=a;
    MV.forEach(([k])=>{const c=r.insertCell(),i=document.createElement('input');i.type='number';i.value=m[k];i.onchange=()=>{m[k]=+i.value};c.appendChild(i)});
    const c=r.insertCell(),i=document.createElement('input');i.style.width='140px';i.value=m.dur.join(',');
    i.onchange=()=>{const v=i.value.split(',').map(x=>+x.trim());while(v.length<8)v.push(0);m.dur=v.slice(0,8)};c.appendChild(i)});
  e.appendChild(t);
  e.insertAdjacentHTML('beforeend','<p><small>A arte (quadros, retrato, paleta) começa igual à do lutador de origem; troque pela arte própria desenhando no SG Pixel.</small></p>');
}
function nome(base){let n=base,k=2;while(G.fighters.some(f=>f.name.toLowerCase()==n.toLowerCase()))n=base+' '+k++;return n}
function clonar(i,nm){if(G.fighters.length>=MAX){msg('Limite de '+MAX+' lutadores.');return}
  const s=G.fighters[i],c=JSON.parse(JSON.stringify(s));c.name=nome(nm||s.name+' (cópia)');
  if(c.traits.frames_from===undefined)c.traits.frames_from=i;c.traits.clone_of=s.name;
  G.fighters.push(c);sel=G.fighters.length-1;refresh();msg('Criado '+c.name+'. Lembre de salvar.')}
$('abrir').onclick=()=>$('arq').click();
$('arq').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{G=JSON.parse(await f.text());sel=0;refresh();msg(f.name+' aberto: '+G.fighters.length+' lutadores.')}catch(x){msg('Arquivo inválido.')}};
$('clonar').onclick=()=>clonar(sel);
$('novo').onclick=()=>{const m=prompt('Modelo (digite o número): '+G.fighters.map((f,i)=>i+'='+f.name).join('  '),'0');if(m===null)return;
  const i=+m;if(!G.fighters[i]){msg('Modelo inválido.');return}const n=prompt('Nome do novo lutador:','Novo lutador');if(n)clonar(i,n)};
$('rem').onclick=()=>{if(sel<ORIG)return;const i=sel;if(G.fighters.some(f=>f.traits.frames_from===i)){msg('Outro lutador usa a arte deste.');return}
  if(!confirm('Excluir '+G.fighters[i].name+'?'))return;G.fighters.splice(i,1);G.fighters.forEach(f=>{if(f.traits.frames_from>i)f.traits.frames_from--});sel=0;refresh()};
$('arqImg').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;msg('Convertendo a imagem para o SNES…');
  const bm=await createImageBitmap(fl),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;const g=c.getContext('2d');g.drawImage(bm,0,0);
  const st=SFStage.convert(g.getImageData(0,0,c.width,c.height)),f=G.fighters[sel],nm=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'.sfstage.json';
  STAGES[nm]=st;f.traits.stage=nm;refresh();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:'application/json'}));a.download=nm;a.click();
  msg('Estágio criado ('+st.tiles+' tiles). Baixei '+nm+': guarde na pasta project/ junto com o game.json.')};
$('arqStg').onchange=async e=>{for(const f of e.target.files){try{const o=JSON.parse(await f.text());if(o.format!=='sf-stage')throw 0;STAGES[f.name]=o}catch(x){msg(f.name+' não é um estágio.');return}}e.target.value='';refresh();msg('Estágio(s) carregado(s).')};
const HUDC=[[2,'Barra de vida'],[1,'Borda da barra de vida'],[3,'Fundo da barra de vida'],[10,'Barra de super'],[9,'Borda da barra de super'],[11,'Fundo da barra de super']];
const w2hex=w=>'#'+[w&31,(w>>5)&31,(w>>10)&31].map(v=>Math.round(v*255/31).toString(16).padStart(2,'0')).join('');
const hex2w=h=>{const n=parseInt(h.slice(1),16);return ((n>>19)&31)|(((n>>11)&31)<<5)|(((n>>3)&31)<<10)};
$('regras').onclick=()=>{
  const gm=G.game=G.game||{hud_hp_row:4,hud_win_row:5,hud_sp_row:23,rounds_to_win:2,hud_pal:[0,0x7fff,0x175f,0xc53,0,0,0,0,0,0x7fff,0x7f4c,0x38a2]};
  document.querySelectorAll('#lista .it').forEach(b=>b.classList.remove('on'));
  const e=$('ed');e.innerHTML='<h3>Regras e HUD (valem para o jogo todo)</h3>';const g=document.createElement('div');g.className='g';
  [['rounds_to_win','Rounds para vencer (1 ou 2)',1,2],['hud_hp_row','Linha da barra de vida (2 a 24)',2,24],['hud_win_row','Linha das bolinhas de round (2 a 25)',2,25],['hud_sp_row','Linha da barra de super (2 a 24)',2,24]].forEach(([k,n,mi,ma])=>{
    const l=document.createElement('label');l.textContent=n;const i=document.createElement('input');i.type='number';i.min=mi;i.max=ma;i.value=gm[k];
    i.onchange=()=>{gm[k]=Math.max(mi,Math.min(ma,+i.value||mi));i.value=gm[k]};l.appendChild(i);g.appendChild(l)});
  HUDC.forEach(([ix,n])=>{const l=document.createElement('label');l.textContent=n;const i=document.createElement('input');i.type='color';i.value=w2hex(gm.hud_pal[ix]);
    i.oninput=()=>{gm.hud_pal[ix]=hex2w(i.value)};l.appendChild(i);g.appendChild(l)});
  e.appendChild(g);
  e.insertAdjacentHTML('beforeend','<p><small>As linhas contam de cima (cada linha = 8 px; a tela tem 28). As cores viram as do SNES (32 tons por canal). Clique em Jogar para ver.</small></p>');
};
$('telas').onclick=()=>{if(!G.flow||!G.flow.nodes||!G.flow.nodes.length)G.flow=JSON.parse(JSON.stringify(SFBuild.DEFAULT_FLOW));
  document.querySelectorAll('#lista .it').forEach(b=>b.classList.remove('on'));SFTelas.open(G,$('ed'),()=>msg('Fluxo alterado: salve o game.json e clique em Jogar para testar.'))};
$('arte').onclick=()=>$('arqArte').click();
$('arqArte').onchange=async e=>{for(const f of e.target.files){try{const o=JSON.parse(await f.text());if(o.format!=='sf-fighter')throw 0;ARTS[f.name]=o;}catch(x){msg(f.name+' não é um arquivo exportado do SF Pixel.');return}}msg(Object.keys(ARTS).length+' arquivo(s) de arte carregado(s). Escolha a arte no lutador.');refresh()};
async function motor(){
  if(BASE&&BASEJ)return true;
  try{BASE=new Uint8Array(await (await fetch('../engine/base.sfc')).arrayBuffer());BASEJ=await (await fetch('../engine/base.json')).json();return true}
  catch(x){msg('Não achei a ROM-motor sozinho (abra pelo servidor local). Escolha engine/base.sfc; o base.json tem que estar junto no servidor.');return false}
}
async function gerar(){
  if(!await motor())return null;
  try{const r=SFBuild.build(BASE,BASEJ,G,ARTS,STAGES);msg('ROM gerada ('+G.fighters.length+' lutadores).');return r}catch(x){msg('Erro ao gerar: '+x.message);return null}
}
$('rom').onclick=async()=>{const r=await gerar();if(!r)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'application/octet-stream'}));a.download='jogo.sfc';a.click()};
$('jogar').onclick=async()=>{const r=await gerar();if(!r)return;const w=window.open('../tester/jogar.html','sfjogo');
  const h=e=>{if(e.data&&e.data.type==='sf-player-ready'&&e.source===w){w.postMessage({type:'sf-rom',rom:r.buffer},'*');window.removeEventListener('message',h)}};window.addEventListener('message',h)};
$('salvar').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(G,null,2)],{type:'application/json'}));a.download='game.json';a.click();msg('game.json baixado: coloque na pasta project/ e gere a ROM.')};
</script></body></html>
