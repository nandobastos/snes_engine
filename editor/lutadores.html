<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SF Engine</title>
<link rel="stylesheet" href="tema.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:14px system-ui,"Segoe UI",sans-serif;display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.hidden{display:none!important}
/* menu lateral */
.side{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:16px 12px;gap:10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:22px;font-weight:800;letter-spacing:.02em;margin:2px 6px 8px}.logo span{color:var(--ac2)}
.nav button,.side .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--tx);cursor:pointer;font:inherit}
.nav button:hover,.side .it:hover{background:var(--bg)}.nav button.on,.side .it.on{background:var(--ac);color:#fff}
.side .it canvas{width:28px;height:40px;image-rendering:pixelated;border-radius:4px;background:var(--bg);flex:none}
.side .it span{display:flex;flex-direction:column;line-height:1.2}.side .it small{color:var(--mu);font-size:11px}.side .it.on small{color:#e6dff2}
.sec{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:8px 8px 0}
.promo{margin-top:auto;background:linear-gradient(160deg,#2a2330,#0d0c0c);color:#fff;border-radius:16px;padding:14px;text-align:center}
.promo b{display:block;font-size:15px;margin-bottom:4px}.promo small{color:#c7b7e0}
.promo button{margin-top:10px;width:100%;background:var(--ac)!important;color:#fff!important;border:0!important;border-radius:10px;padding:9px;font-weight:600}
.side .links button{width:100%;margin-top:6px}
/* topo */
.main{padding:18px 22px;min-width:0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:26px;font-weight:600;margin:0 auto 0 0;color:var(--tx)}
button{border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit}
#msg{color:var(--mu);width:100%;font-size:13px;min-height:18px}
/* caixas */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--mu);font-size:13px}.kpi b{font-size:26px;font-weight:600}.kpi small{color:var(--mu)}
.kpi.dark{background:linear-gradient(160deg,#2a2330,#0d0c0c);color:#fff;border-color:#0d0c0c}.kpi.dark span,.kpi.dark small{color:#c7b7e0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600;color:var(--tx)}
.c-ret{grid-column:span 3}.c-cen{grid-column:span 4}.c-anim{grid-column:span 5}.c-dados{grid-column:span 4}.c-cmd{grid-column:span 8}.c-car{grid-column:span 12}.c-gol{grid-column:span 12}.c-flow{grid-column:span 12}
.c-ret canvas{width:112px;height:160px;display:block;margin:0 auto;background:var(--bg);border-radius:12px}
.c-cen canvas{width:100%;max-width:256px;aspect-ratio:256/224;display:block;border-radius:12px}
canvas.px{image-rendering:pixelated}
.anims{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mini{background:var(--bg);border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:4px 2px}
.mini canvas{width:100%;max-width:112px;aspect-ratio:1;image-rendering:pixelated}.mini span{font-size:11px;color:var(--mu);margin-bottom:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
label{display:flex;justify-content:space-between;gap:6px;align-items:center}label.col{flex-direction:column;align-items:stretch;margin-top:8px}label.sel{gap:6px}
input,select,textarea{border-radius:8px;padding:5px 8px;font:inherit}input{width:70px}input.n{width:210px}textarea{width:100%}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 16px}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}td,th{border-bottom:1px solid var(--ln);padding:4px;text-align:left;font-weight:normal}th{color:var(--mu);font-size:12px}
div.cmd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}div.cmd b{flex:1 1 240px;font-weight:normal}div.cmd .seq{min-width:110px;font-size:18px;letter-spacing:2px}div.cmd .ks button{padding:3px 8px;margin:1px;border-radius:8px}
.bad{color:#e05555}
.flow{display:grid;grid-template-columns:1fr 270px;gap:10px}.flow-canvas{overflow:auto;max-height:72vh;background:var(--bg);border:1px solid var(--ln);border-radius:12px}.flow-side label{display:block}.flow-side select,.flow-side input{width:100%;margin-top:4px}
/* editor de animacao embutido */
#anim{position:fixed;inset:0 0 0 230px;background:var(--bg);display:flex;flex-direction:column;z-index:50}
#anim .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--ln);background:var(--pn)}#anim .bar b{margin-right:auto}
#anim iframe{flex:1;border:0;width:100%}
@media(max-width:1100px){.c-ret,.c-cen,.c-anim,.c-dados,.c-cmd{grid-column:span 6}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){body{grid-template-columns:1fr}.side{position:static;height:auto}#anim{inset:0}.grid>*{grid-column:span 12!important}.anims{grid-template-columns:repeat(3,1fr)}}
</style>
<script src="tema.js"></script></head><body>
<aside class="side">
  <div class="logo">SF<span>Engine</span></div>
  <div class="nav"><button data-v="lutador" id="navl">🥊 Lutadores</button><button data-v="telas" id="telas" disabled>🗺️ Telas (fluxo)</button><button data-v="regras" id="regras" disabled>⚙️ Regras e HUD</button></div>
  <div class="sec">Lutadores</div>
  <div id="lista"></div>
  <div class="promo"><b>Testar o jogo</b><small>Gera a ROM com tudo o que está aqui e abre o emulador.</small><button id="jogar" disabled>▶ Jogar</button></div>
  <div class="links"><button id="salvar" disabled>💾 Salvar game.json</button><button id="rom" disabled>⬇ Gerar ROM (.sfc)</button><button id="abrir">📂 Abrir game.json</button></div>
</aside>
<div class="main">
  <header class="top"><h1 id="titulo">Lutadores</h1>
    <button id="clonar" disabled>Clonar</button><button id="novo" disabled>Novo</button><button id="rem" disabled>Excluir</button>
    <button id="arte" disabled title="Relê a arte e os estágios da pasta project/">Recarregar arte</button>
    <div id="msg">Abra o arquivo project/game.json do seu projeto (ou use o Abrir SF Engine.bat).</div></header>
  <div id="ed"></div>
</div>
<div id="anim" class="hidden"><div class="bar"><b id="anim-t">Editor de animação</b><small>Exportar para a SF Engine (Ctrl+Shift+M) aplica a arte no lutador.</small><button id="anim-x">✕ Voltar</button></div><iframe id="anim-f" title="SF Pixel"></iframe></div>
<input type="file" id="arq" accept=".json" hidden><input type="file" id="arqArte" accept=".json" multiple hidden><input type="file" id="arqBase" accept=".sfc" hidden><input type="file" id="arqImg" accept="image/*" hidden><input type="file" id="arqStg" accept=".json" multiple hidden>
<script src="sfbuild.js"></script>
<script src="sfstage.js"></script>
<script src="sfview.js"></script>
<script src="telas.js"></script>
<script>
const TOK=[['↓',14,2],['↘',14,10],['→',14,8],['↗',15,9],['↑',15,1],['↖',15,5],['←',14,4],['↙',14,6],['→*',12,8],['←*',12,4]];
const tok=([m,v])=>{const t=TOK.find(x=>x[1]===m&&x[2]===v);return t?t[0]:m+'/'+v};
const DEFCMD=[[[14,2],[14,10],[14,8]],[[14,2],[14,6],[14,4]],[[14,8],[14,10]],[[14,8],[14,10],[12,8]],[[14,2],[14,10],[14,8],[14,2],[14,10],[14,8]]];
const CMDN=['Magia + soco (Hadouken; Sagat: Tiger Shot, chute = rasteiro)','Giro + chute (Tatsumaki)','Golpe para cima + soco (Shoryuken; Sagat: Tiger Uppercut, chute = Tiger Knee)','Atalho do golpe para cima','Super + soco forte (3 bolinhas)'];
const MAX=8, ORIG=3; let G=null, sel=0;
let SERVIDOR=false;   // aberto pelo "Abrir SF Engine.bat": le e salva direto na pasta project/
async function salvarNaPasta(nome,txt){if(!SERVIDOR)return false;try{const r=await fetch('/api/salvar?f='+encodeURIComponent(nome),{method:'POST',body:txt});return r.ok}catch(e){return false}} const ARTS={}, STAGES={}; let BASE=null, BASEJ=null;
const $=id=>document.getElementById(id);
const TR=[["jump_vy","Força do pulo"],["walk_ticks","Passo do andar (quadros)"],["walk_adj","Ajuste de velocidade"],["fb_alt_hi","Altura da magia (alta)"],["fb_alt_lo","Altura da magia (baixa)"],["fb_sfx","Som da magia"],["hp_close_hk","HP de perto = HK de perto (0/1)"],["walk_pingpong","Andar vai e volta (0/1)"],["moveset","Especiais (0 = estilo Ryu, 1 = Sagat)"],["walk_fwd","Velocidade andando para frente"],["walk_back","Velocidade andando para trás"],["jump_vx","Velocidade do pulo para o lado"],["grav_up","Gravidade subindo (menor = pula mais alto)"],["grav_dn","Gravidade descendo"],["fb_spd","Magia fraca: velocidade"],["fb_dmg","Magia fraca: dano"],["fb_spd_s","Magia média: velocidade"],["fb_dmg_s","Magia média: dano"],["fb_spd_ex","Magia reforçada (EX): velocidade"],["fb_dmg_ex","Magia reforçada (EX): dano"],["fb_spd_sup","Super: velocidade"],["fb_dmg_sup","Super: dano"]];
const MV=[["dmg","Dano"],["stun","Stun"],["hgt","Altura"],["flags","Flags"],["hitstop","Hitstop"],["snd_swing","Som do golpe"],["snd_hit","Som do impacto"]];
function msg(t){$('msg').textContent=t}
let V=null; const ANIMS=[['idle','Parado'],['walk','Andar'],['mp','Soco fraco'],['hp','Soco forte'],['mk','Chute fraco'],['hk','Chute forte'],['hadouken','Magia'],['shoryu','Golpe p/ cima'],['tatsu','Giro'],['victory','Vitória']];
async function vis(){if(V)return V;if(!await motor())return null;try{V=SFView.open(BASE,BASEJ)}catch(e){V=null}return V}
function card(title,cls,html){const d=document.createElement('section');d.className='card '+(cls||'');d.innerHTML=(title?'<h3>'+title+'</h3>':'')+(html||'');return d}
function refresh(){
  const L=$('lista');L.innerHTML='';
  G.fighters.forEach((f,i)=>{const b=document.createElement('button');b.className='it'+(i==sel&&VIEW==='lutador'?' on':'');
    const t=f.traits;b.innerHTML='<canvas width="28" height="40"></canvas><span>'+esc(f.name)+'<small>'+(t.clone_of?'clone de '+esc(t.clone_of):i<ORIG?'original':'novo')+'</small></span>';
    b.onclick=()=>{if(!$('anim').classList.contains('hidden')){if(i!==EDITANDO&&confirm('Abrir '+f.name+' no editor de animação? O que não foi exportado do lutador atual se perde.')){sel=i;VIEW='lutador';refresh();abrirEditor(G.fighters[i])}return}sel=i;VIEW='lutador';refresh()};L.appendChild(b);
    vis().then(v=>{if(!v)return;const c=b.querySelector('canvas'),g=c.getContext('2d');g.imageSmoothingEnabled=false;try{g.drawImage(v.portrait(G,f,ARTS),0,0,28,40)}catch(e){}})});
  ['clonar','novo','salvar','arte','rom','jogar','regras','telas'].forEach(k=>$(k).disabled=false);$('rem').disabled=sel<ORIG;
  document.querySelectorAll('.nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
  document.querySelectorAll('.side .it').forEach((b,i)=>b.classList.toggle('on',(!$('anim').classList.contains('hidden')&&i===EDITANDO)||(i==sel&&VIEW==='lutador')));
  if(VIEW==='regras')return regras();
  if(VIEW==='telas')return telas();
  const f=G.fighters[sel],e=$('ed');e.innerHTML='';$('titulo').textContent=f.name;
  // ---- numeros
  const k=document.createElement('div');k.className='kpis';e.appendChild(k);
  const maxd=Math.max(...G.atk_names.map(a=>f.moves[a].dmg));
  const kp=(t,v,s,dark)=>'<div class="kpi'+(dark?' dark':'')+'"><span>'+t+'</span><b>'+v+'</b><small>'+s+'</small></div>';
  k.innerHTML=kp('Lutador',esc(f.name),f.traits.clone_of?'clone de '+esc(f.traits.clone_of):sel<ORIG?'original':'novo',true)+kp('Quadros','…','')+kp('Maior quadro','…','pedaços 16×16 (máx. 24)')+kp('Golpe mais forte',maxd,'de dano');
  vis().then(v=>{if(!v)return;const st=v.stats(G,f,ARTS);const ks=k.querySelectorAll('.kpi b'),ss=k.querySelectorAll('.kpi small');ks[1].textContent=st.frames;ss[1].textContent=st.anims+' animações';ks[2].textContent=st.maxPieces+'/24';ks[2].className=st.maxPieces>24?'bad':''});
  const grid=document.createElement('div');grid.className='grid';e.appendChild(grid);
  // ---- retrato
  const ret=card('Retrato','c-ret','<canvas class="px" width="56" height="80"></canvas><p><small>Aparece na seleção, no VS, no Continue e na vitória.</small></p><div class="row"><button class="p" data-a="edit">Editar animações e retrato</button></div>');
  grid.appendChild(ret);ret.querySelector('[data-a=edit]').onclick=()=>abrirEditor(f);
  // ---- cenario
  const cen=card('Cenário','c-cen','<canvas class="px" width="256" height="224"></canvas><div class="row"><select data-a="st"></select><button data-a="new">Criar de uma imagem…</button><button data-a="load">Carregar…</button></div><small data-a="inf">Usado quando ele é o P2 (o oponente).</small>');
  grid.appendChild(cen);
  const ss=cen.querySelector('[data-a=st]');
  ss.innerHTML='<option value="">Cenário padrão</option>'+Object.keys(STAGES).concat(f.traits.stage&&!STAGES[f.traits.stage]?[f.traits.stage]:[]).map(n=>'<option'+(n===f.traits.stage?' selected':'')+'>'+esc(n)+'</option>').join('');
  ss.onchange=()=>{if(ss.value)f.traits.stage=ss.value;else delete f.traits.stage;refresh()};
  cen.querySelector('[data-a=new]').onclick=()=>$('arqImg').click();cen.querySelector('[data-a=load]').onclick=()=>$('arqStg').click();
  if(f.traits.stage&&!STAGES[f.traits.stage])cen.querySelector('[data-a=inf]').innerHTML='<span class="bad">Falta o arquivo '+esc(f.traits.stage)+'.</span>';
  else if(f.traits.stage)cen.querySelector('[data-a=inf]').textContent=STAGES[f.traits.stage].tiles+' tiles de 512 · usado quando ele é o P2.';
  // ---- animacoes
  const an=card('Animações','c-anim','<div class="anims"></div><div class="row"><label class="sel">Arte <select data-a="art"></select></label><button data-a="edit">Abrir no editor de animação</button></div>');
  grid.appendChild(an);
  const as=an.querySelector('[data-a=art]');
  as.innerHTML='<option value="">a do lutador de origem</option>'+Object.keys(ARTS).concat(f.traits.art&&!ARTS[f.traits.art]?[f.traits.art]:[]).map(n=>'<option'+(n===f.traits.art?' selected':'')+'>'+esc(n)+'</option>').join('');
  as.onchange=()=>{if(as.value)f.traits.art=as.value;else delete f.traits.art;refresh()};
  an.querySelector('[data-a=edit]').onclick=()=>abrirEditor(f);
  const box=an.querySelector('.anims');
  ANIMS.forEach(([n,l])=>{const d=document.createElement('div');d.className='mini';d.innerHTML='<canvas width="112" height="112"></canvas><span>'+l+'</span>';box.appendChild(d)});
  vis().then(v=>{if(!v){ret.querySelector('p small').textContent='Abra pelo Abrir SF Engine.bat para ver as imagens.';return}
    const pc=ret.querySelector('canvas').getContext('2d');pc.drawImage(v.portrait(G,f,ARTS),0,0);
    cen.querySelector('canvas').getContext('2d').drawImage(v.stage(G,f,STAGES),0,0);
    box.querySelectorAll('canvas').forEach((c,i)=>SFView.player(c,v.anim(G,f,ANIMS[i][0],ARTS),ANIMS[i][0]==='idle'||ANIMS[i][0]==='walk'?140:110))});
  // ---- dados
  const da=card('Dados','c-dados','<label>Nome <input class="n" data-a="nm"></label><label class="col">Frase de vitória <textarea rows="3" maxlength="112" data-a="q" placeholder="Ex.: Meus punhos são de ferro! (até 4 linhas de 28 letras)"></textarea></label>');
  grid.appendChild(da);const ni=da.querySelector('[data-a=nm]');ni.value=f.name;ni.onchange=()=>{f.name=ni.value.trim()||f.name;refresh()};
  const qa=da.querySelector('[data-a=q]');qa.value=f.win_quote||'';qa.oninput=()=>{f.win_quote=qa.value};
  // ---- comandos
  const co=card('Comandos dos especiais','c-cmd','<p><small>Do primeiro ao último passo, olhando para a direita (→ = frente). →* = qualquer frente.</small></p>');grid.appendChild(co);
  if(!f.commands)f.commands=JSON.parse(JSON.stringify(DEFCMD));
  CMDN.forEach((nm,ci)=>{const row=document.createElement('div');row.className='cmd';
    const show=()=>row.querySelector('.seq').textContent=f.commands[ci].length?f.commands[ci].map(tok).join(' '):'(desligado)';
    row.innerHTML='<b>'+nm+'</b><span class="seq"></span><span class="ks">'+TOK.map((t,ti)=>'<button data-t="'+ti+'">'+t[0]+'</button>').join('')+'<button data-t="x">⌫</button><button data-t="d">padrão</button></span>';
    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=b.dataset.t,c=f.commands[ci];
      if(t==='x')c.pop();else if(t==='d')f.commands[ci]=JSON.parse(JSON.stringify(DEFCMD[ci]));else if(c.length<7)c.push([TOK[+t][1],TOK[+t][2]]);else msg('Máximo 7 passos.');show()});
    co.appendChild(row);show()});
  // ---- caracteristicas
  const ca=card('Características','c-car');const g=document.createElement('div');g.className='g';ca.appendChild(g);grid.appendChild(ca);
  TR.forEach(([k2,n])=>{const l=document.createElement('label');l.textContent=n;const i=document.createElement('input');i.type='number';i.value=f.traits[k2];
    i.onchange=()=>{f.traits[k2]=+i.value};l.appendChild(i);g.appendChild(l)});
  // ---- golpes
  const go=card('Golpes','c-gol');grid.appendChild(go);
  const t=document.createElement('table');t.innerHTML='<tr><th>Golpe</th>'+MV.map(m=>'<th>'+m[1]+'</th>').join('')+'<th>Duração dos quadros (8)</th></tr>';
  G.atk_names.forEach(a=>{const m=f.moves[a];const r=t.insertRow();r.insertCell().textContent=a;
    MV.forEach(([k2])=>{const c=r.insertCell(),i=document.createElement('input');i.type='number';i.value=m[k2];i.onchange=()=>{m[k2]=+i.value};c.appendChild(i)});
    const c=r.insertCell(),i=document.createElement('input');i.style.width='140px';i.value=m.dur.join(',');
    i.onchange=()=>{const v=i.value.split(',').map(x=>+x.trim());while(v.length<8)v.push(0);m.dur=v.slice(0,8)};c.appendChild(i)});
  go.appendChild(t);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let VIEW='lutador';
// ---- editor de animacao (SF Pixel) dentro da engine
function abrirEditor(f){
  const i=G.fighters.indexOf(f),t=f.traits,src=t.art&&ARTS[t.art]?'arte='+encodeURIComponent(t.art):'jogo='+(t.frames_from!==undefined?t.frames_from:i);
  $('anim-t').textContent='Editor de animação · '+f.name;
  $('anim-f').src='../sfpixel/index.html?embed=1&'+src+'&nome='+encodeURIComponent(f.name);
  $('anim').classList.remove('hidden');EDITANDO=i;
}
let EDITANDO=-1;
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='sf-exported'||EDITANDO<0)return;
  ARTS[e.data.file]=e.data.data;G.fighters[EDITANDO].traits.art=e.data.file;V&&0;refresh();
  msg('Arte de '+G.fighters[EDITANDO].name+' atualizada ('+e.data.file+'). Salve o game.json e clique em Jogar.')});
function nome(base){let n=base,k=2;while(G.fighters.some(f=>f.name.toLowerCase()==n.toLowerCase()))n=base+' '+k++;return n}
function clonar(i,nm){if(G.fighters.length>=MAX){msg('Limite de '+MAX+' lutadores.');return}
  const s=G.fighters[i],c=JSON.parse(JSON.stringify(s));c.name=nome(nm||s.name+' (cópia)');
  if(c.traits.frames_from===undefined)c.traits.frames_from=i;c.traits.clone_of=s.name;
  G.fighters.push(c);sel=G.fighters.length-1;refresh();msg('Criado '+c.name+'. Lembre de salvar.')}
$('abrir').onclick=()=>$('arq').click();
$('arq').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{G=JSON.parse(await f.text());sel=0;refresh();msg(f.name+' aberto: '+G.fighters.length+' lutadores.')}catch(x){msg('Arquivo inválido.')}};
$('clonar').onclick=()=>clonar(sel);
$('novo').onclick=()=>{const m=prompt('Modelo (digite o número): '+G.fighters.map((f,i)=>i+'='+f.name).join('  '),'0');if(m===null)return;
  const i=+m;if(!G.fighters[i]){msg('Modelo inválido.');return}const n=prompt('Nome do novo lutador:','Novo lutador');if(n)clonar(i,n)};
$('rem').onclick=()=>{if(sel<ORIG)return;const i=sel;if(G.fighters.some(f=>f.traits.frames_from===i)){msg('Outro lutador usa a arte deste.');return}
  if(!confirm('Excluir '+G.fighters[i].name+'?'))return;G.fighters.splice(i,1);G.fighters.forEach(f=>{if(f.traits.frames_from>i)f.traits.frames_from--});sel=0;refresh()};
$('arqImg').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;msg('Convertendo a imagem para o SNES…');
  const bm=await createImageBitmap(fl),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;const g=c.getContext('2d');g.drawImage(bm,0,0);
  const st=SFStage.convert(g.getImageData(0,0,c.width,c.height)),f=G.fighters[sel],nm=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'.sfstage.json';
  STAGES[nm]=st;f.traits.stage=nm;refresh();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:'application/json'}));if(await salvarNaPasta(nm,JSON.stringify(st))){msg('Estágio criado ('+st.tiles+' tiles) e salvo em project/'+nm+'. Salve o game.json.');return}
  a.download=nm;a.click();
  msg('Estágio criado ('+st.tiles+' tiles). Baixei '+nm+': guarde na pasta project/ junto com o game.json.')};
$('arqStg').onchange=async e=>{for(const f of e.target.files){try{const o=JSON.parse(await f.text());if(o.format!=='sf-stage')throw 0;STAGES[f.name]=o}catch(x){msg(f.name+' não é um estágio.');return}}e.target.value='';refresh();msg('Estágio(s) carregado(s).')};
const HUDC=[[2,'Barra de vida'],[1,'Borda da barra de vida'],[3,'Fundo da barra de vida'],[10,'Barra de super'],[9,'Borda da barra de super'],[11,'Fundo da barra de super']];
const w2hex=w=>'#'+[w&31,(w>>5)&31,(w>>10)&31].map(v=>Math.round(v*255/31).toString(16).padStart(2,'0')).join('');
const hex2w=h=>{const n=parseInt(h.slice(1),16);return ((n>>19)&31)|(((n>>11)&31)<<5)|(((n>>3)&31)<<10)};
function regras(){
  const gm=G.game=G.game||{hud_hp_row:4,hud_win_row:5,hud_sp_row:23,rounds_to_win:2,hud_pal:[0,0x7fff,0x175f,0xc53,0,0,0,0,0,0x7fff,0x7f4c,0x38a2]};
  const e=$('ed');e.innerHTML='';$('titulo').textContent='Regras e HUD';const cc=card('Regras e HUD (valem para o jogo todo)','');e.appendChild(cc);const g=document.createElement('div');g.className='g';
  [['rounds_to_win','Rounds para vencer (1 ou 2)',1,2],['hud_hp_row','Linha da barra de vida (2 a 24)',2,24],['hud_win_row','Linha das bolinhas de round (2 a 25)',2,25],['hud_sp_row','Linha da barra de super (2 a 24)',2,24]].forEach(([k,n,mi,ma])=>{
    const l=document.createElement('label');l.textContent=n;const i=document.createElement('input');i.type='number';i.min=mi;i.max=ma;i.value=gm[k];
    i.onchange=()=>{gm[k]=Math.max(mi,Math.min(ma,+i.value||mi));i.value=gm[k]};l.appendChild(i);g.appendChild(l)});
  HUDC.forEach(([ix,n])=>{const l=document.createElement('label');l.textContent=n;const i=document.createElement('input');i.type='color';i.value=w2hex(gm.hud_pal[ix]);
    i.oninput=()=>{gm.hud_pal[ix]=hex2w(i.value)};l.appendChild(i);g.appendChild(l)});
  cc.appendChild(g);
  cc.insertAdjacentHTML('beforeend','<p><small>As linhas contam de cima (cada linha = 8 px; a tela tem 28). As cores viram as do SNES (32 tons por canal). Clique em Jogar para ver.</small></p>');
}
$('regras').onclick=()=>{fecharEditor();VIEW='regras';refresh()};
function telas(){if(!G.flow||!G.flow.nodes||!G.flow.nodes.length)G.flow=JSON.parse(JSON.stringify(SFBuild.DEFAULT_FLOW));
  $('titulo').textContent='Telas do Arcade';const e=$('ed');e.innerHTML='';const cc=card('','c-flow');e.appendChild(cc);
  SFTelas.open(G,cc,()=>msg('Fluxo alterado: salve o game.json e clique em Jogar para testar.'))}
$('telas').onclick=()=>{fecharEditor();VIEW='telas';refresh()};
$('arte').onclick=async()=>{if(SERVIDOR){await lerPasta();refresh();msg('Arte e estágios relidos da pasta project/ ('+Object.keys(ARTS).length+' arte(s), '+Object.keys(STAGES).length+' estágio(s)).');return}$('arqArte').click()};
$('arqArte').onchange=async e=>{for(const f of e.target.files){try{const o=JSON.parse(await f.text());if(o.format!=='sf-fighter')throw 0;ARTS[f.name]=o;}catch(x){msg(f.name+' não é um arquivo exportado do SF Pixel.');return}}msg(Object.keys(ARTS).length+' arquivo(s) de arte carregado(s). Escolha a arte no lutador.');refresh()};
async function motor(){
  if(BASE&&BASEJ)return true;
  try{BASE=new Uint8Array(await (await fetch('../engine/base.sfc')).arrayBuffer());BASEJ=await (await fetch('../engine/base.json')).json();return true}
  catch(x){msg('Não achei a ROM-motor sozinho (abra pelo servidor local). Escolha engine/base.sfc; o base.json tem que estar junto no servidor.');return false}
}
async function gerar(){
  if(!await motor())return null;
  try{const r=SFBuild.build(BASE,BASEJ,G,ARTS,STAGES);msg('ROM gerada ('+G.fighters.length+' lutadores).');return r}catch(x){msg('Erro ao gerar: '+x.message);return null}
}
$('rom').onclick=async()=>{const r=await gerar();if(!r)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'application/octet-stream'}));a.download='jogo.sfc';a.click()};
$('jogar').onclick=async()=>{const r=await gerar();if(!r)return;const w=window.open('../tester/jogar.html','sfjogo');
  const h=e=>{if(e.data&&e.data.type==='sf-player-ready'&&e.source===w){w.postMessage({type:'sf-rom',rom:r.buffer},'*');window.removeEventListener('message',h)}};window.addEventListener('message',h)};
$('salvar').onclick=async()=>{const txt=JSON.stringify(G,null,2);
  if(await salvarNaPasta('game.json',txt)){msg('Salvo em project/game.json.');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='game.json';a.click();msg('game.json baixado: coloque na pasta project/ e gere a ROM.')};

// aberto pelo servidor da SF Engine: abre o project/game.json e os arquivos de arte/estagio que ele usa
(async()=>{try{const p=await fetch('/api/ping');if(!p.ok)return;SERVIDOR=true;$('abrir').style.display='none';
  const r=await fetch('../project/game.json');if(!r.ok)return;G=await r.json();
  await lerPasta();
  sel=0;refresh();msg('Projeto aberto da pasta (project/game.json). Salvar grava direto na pasta.')}catch(e){}})();
async function lerPasta(){   // le toda a arte (.sffighter.json) e os estagios (.sfstage.json) da pasta project/
  const files=await (await fetch('/api/arquivos')).json();
  for(const fn of files){if(!/\.(sffighter|sfstage)\.json$/.test(fn))continue;try{const o=await (await fetch('../project/'+encodeURIComponent(fn))).json();if(o.format==='sf-fighter')ARTS[fn]=o;else if(o.format==='sf-stage')STAGES[fn]=o}catch(e){}}
}

$('navl').onclick=()=>{fecharEditor();VIEW='lutador';if(G)refresh()};
function fecharEditor(){$('anim').classList.add('hidden');$('anim-f').src='about:blank';EDITANDO=-1}
$('anim-x').onclick=()=>{fecharEditor();refresh()};
</script></body></html>
