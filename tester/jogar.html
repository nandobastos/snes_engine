<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testador SF Engine</title>
<style>
  :root { color-scheme: dark; --acc: #7a5c9b; --acc2: #a78fc6; }
  html, body { margin: 0; height: 100%; background: #0d0c0c; color: #e5e5e5; font: 14px system-ui, sans-serif; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #pick { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #pick h1 { font-size: 20px; margin: 0; color: var(--acc2); }
  #pick label { background: var(--acc); color: #fff; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  #pick small { color: #a5a2a2; max-width: 520px; line-height: 1.4; }
  #pick.drag { outline: 3px dashed var(--acc2); outline-offset: -16px; }
</style>
</head>
<body>
<!-- Testador da SF Engine: EmulatorJS (GPL-3.0, ejs/LICENSE-EmulatorJS) com o nucleo snes9x (licenca do snes9x: uso nao comercial).
     Tudo roda local (pasta ejs/), sem internet. Para vender o jogo/engine, o testador precisa ser revisto por causa dessas licencas. -->
<div id="game"></div>
<div id="pick">
  <h1>Testador SF Engine (Super Nintendo)</h1>
  <label>Abrir ROM (.sfc)<input type="file" id="file" accept=".sfc,.smc" hidden></label>
  <small>Ou arraste o arquivo para esta janela. Gere a ROM com <b>python3 tools/exportar.py</b> (fica em saida/jogo.sfc).<br>
  Teclado: setas = direcional · Z = B · X = A · A = Y · S = X · Q = L · W = R · Enter = Start · Shift = Select</small>
</div>
<script>
"use strict";
const DATA = "ejs/data/";
let started = false;
function start(bytes) {
  if (started) { location.reload(); return; }
  started = true;
  document.getElementById("pick").remove();
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
  window.EJS_player = "#game";
  window.EJS_core = "snes";
  window.EJS_gameName = "sf-engine";
  window.EJS_gameUrl = url;
  window.EJS_pathtodata = DATA;
  window.EJS_startOnLoaded = true;
  window.EJS_threads = false;
  window.EJS_defaultOptions = { vsync: "enabled", shader: "disabled", fps: "hide" };
  window.EJS_language = "en-US";
  window.EJS_color = "#7a5c9b";
  window.EJS_backgroundColor = "#0d0c0c";
  const s = document.createElement("script");
  s.src = DATA + "loader.js";
  s.onerror = () => document.body.insertAdjacentHTML("beforeend", '<div id="pick">Não consegui carregar o emulador (pasta ejs/).</div>');
  document.body.appendChild(s);
}
document.getElementById("file").onchange = async (e) => { const f = e.target.files[0]; if (f) start(new Uint8Array(await f.arrayBuffer())); };
const pk = document.getElementById("pick");
["dragenter", "dragover"].forEach((t) => window.addEventListener(t, (e) => { e.preventDefault(); pk && pk.classList.add("drag"); }));
window.addEventListener("dragleave", () => pk && pk.classList.remove("drag"));
window.addEventListener("drop", async (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) start(new Uint8Array(await f.arrayBuffer())); });
// o editor pode mandar a ROM: postMessage({type: "sf-rom", rom: ArrayBuffer})
window.addEventListener("message", (e) => { if (e.data && e.data.type === "sf-rom") start(new Uint8Array(e.data.rom)); });
if (window.parent !== window) window.parent.postMessage({ type: "sf-player-ready" }, "*");
</script>
</body>
</html>
